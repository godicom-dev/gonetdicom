name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # go.mod requires Go 1.26, so the version axis spans the two current stable
  # releases: the minimum the module claims to support, and the next one, which
  # is where a change in the toolchain shows up first. Windows and macOS are here
  # because this is a networking library that nothing but CI exercises off Linux.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.26", "1.27"]
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }}, go${{ matrix.go }})
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Test (race)
        if: runner.os != 'Windows'
        run: go test -race ./...

      # -race needs cgo, and pointing it at whatever gcc the hosted Windows
      # image ships is not a dependency worth taking; the detector still runs on
      # the other two platforms, on the same code.
      - name: Test
        if: runner.os == 'Windows'
        run: go test ./...

      - name: Vet
        run: go vet ./...

  # The PDU and DIMSE decoders read 32-bit length fields straight off the wire,
  # and the mistakes that invites are invisible where int is 64 bits wide: a
  # length above MaxInt32 only goes negative, and only slides past a bounds
  # check, on a 32-bit build. These are the packages that build for one today —
  # anything above them reaches godicom, which does not compile for a 32-bit
  # target (encaps/encode.go: "(1 << 32) - 1 overflows int"). Widen the list when
  # that changes.
  test-386:
    runs-on: ubuntu-latest
    name: test (linux/386)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        env:
          GOARCH: "386"
        run: go test ./pdu ./dimse ./status

  # Every "go test" run above replays the fuzz corpus, which catches regressions
  # against inputs already known. This job looks for new ones. A failure here is
  # a finding, not flakiness: it writes the input to testdata/fuzz, and that file
  # belongs in the fix's commit.
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {pkg: ./pdu, target: FuzzRead}
          - {pkg: ./pdu, target: FuzzDecodePDataTF}
          - {pkg: ./dimse, target: FuzzDecodeElements}
          - {pkg: ./dimse, target: FuzzCommandDecoders}
    name: fuzz (${{ matrix.target }})
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Fuzz
        run: >
          go test ${{ matrix.pkg }}
          -run=${{ matrix.target }} -fuzz=${{ matrix.target }} -fuzztime=60s

      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}-corpus
          path: ${{ matrix.pkg }}/testdata/fuzz
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  # Coverage is one report, so it comes from one job. The matrix above runs the
  # same tests six times to prove they pass elsewhere; letting each of those
  # upload would mean six reports racing to describe the same commit.
  #
  # -covermode=atomic because these tests drive goroutines and -race is on for
  # the same run; Go requires atomic mode under the race detector anyway. -race
  # needs cgo, which is why this job is Linux only and uses go-version-file
  # rather than pinning a version: the number should describe the module, not
  # one toolchain in the matrix.
  coverage:
    runs-on: ubuntu-latest
    name: coverage
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Codecov diffs against the base commit to report patch coverage, and
          # one commit of history is not enough to find it.
          fetch-depth: 2

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test with coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      # No `slug`: in Actions the action reads GITHUB_REPOSITORY, and a
      # hardcoded owner/repo is a second copy of the same fact that goes stale
      # the day the repository is renamed.
      #
      # No `if: always()`: a run that failed halfway writes a partial profile,
      # and uploading it would move the baseline down for a reason that is not
      # about coverage.
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          # A Codecov outage should not block a merge. Report, do not gate:
          # the gate that matters is `go test` failing in the jobs above.
          fail_ci_if_error: false
